name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      implementation_only: ${{ steps.scope.outputs.implementation_only }}
      targets: ${{ steps.scope.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Classify the change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/pr_scope.py --base "$BASE_SHA"

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,   os: ubuntu-24.04, flags: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++' }
          - { name: linux-clang, os: ubuntu-24.04, flags: '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++' }
          - { name: macos,       os: macos-14,     flags: '' }
          - { name: windows,     os: windows-2022, flags: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        shell: bash
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
      - name: Build
        run: cmake --build build/ci --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure --no-tests=error

  # Standard arm64 runners are only available to public repositories.
  test-arm:
    name: test (linux-arm)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/ci --parallel 4
      - run: ctest --test-dir build/ci --output-on-failure --no-tests=error

  sanitizer:
    name: sanitizer (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - run: ctest --preset ${{ matrix.preset }}

  # Every six- and seven-card hand, split into shards so the whole run takes minutes.
  # The five-card domain is part of the regular test job.
  exhaustive:
    name: exhaustive (${{ matrix.cards }}, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cards: [6, 7]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake -S . -B build/exhaustive -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOKER_BUILD_BENCHMARKS=OFF
          cmake --build build/exhaustive --target poker_exhaustive --parallel 4
      - name: Check every ${{ matrix.cards }}-card hand in this shard
        run: |
          python3 tools/check_census.py --binary build/exhaustive/poker_exhaustive \
            --cards ${{ matrix.cards }} --shard ${{ matrix.shard }} --shards 4 \
            --log "$RUNNER_TEMP/census-${{ matrix.cards }}-${{ matrix.shard }}.json"

  lint:
    name: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get install -y -qq clang-format
      - name: clang-format on changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git clang-format --binary clang-format --extensions c,cpp,h,hpp --diff "$BASE_SHA" HEAD > "$RUNNER_TEMP/format.diff" || true
          if grep -q '^[-+]' "$RUNNER_TEMP/format.diff"; then
            echo "::error::Changed lines are not clang-format clean. Run: git clang-format $BASE_SHA"
            cat "$RUNNER_TEMP/format.diff"
            exit 1
          fi
          echo "Formatting is clean."

  # Paired base/candidate timing on one runner. Runs for implementation-only PRs.
  # It fails on a clear regression or a broken build, and passes on "faster" or
  # "inconclusive". The verdict is evidence for the reviewer, not the merge gate.
  benchmark:
    name: benchmark
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.implementation_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the base (its tools and build files are used for both sides)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - name: Compare
        id: gate
        env:
          TARGETS: ${{ needs.scope.outputs.targets }}
        run: |
          args=()
          IFS=, read -ra targets <<< "$TARGETS"
          for target in "${targets[@]}"; do
            [ -n "$target" ] && args+=(--target "$target")
          done
          set +e
          python3 base/tools/gate.py --base base --candidate candidate --out "$RUNNER_TEMP/gate" \
            --exhaustive-max-cards 0 --jobs 4 "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Summarize
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          cp "$RUNNER_TEMP/gate/report.json" "$RUNNER_TEMP/report/report.json"
          python3 base/tools/gate_summary.py --report "$RUNNER_TEMP/report/report.json" --out "$RUNNER_TEMP/report/summary.md"
          echo "$PR_NUMBER" > "$RUNNER_TEMP/report/pr.txt"
          cat "$RUNNER_TEMP/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep raw measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-report
          path: ${{ runner.temp }}/report
          if-no-files-found: error
          retention-days: 30
      - name: Keep gate logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-logs
          path: |
            ${{ runner.temp }}/gate/*.log
            ${{ runner.temp }}/gate/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verdict
        run: |
          case "${{ steps.gate.outputs.exit_code }}" in
            0) echo "Faster on the declared targets with no regression." ;;
            3) echo "Inconclusive. See the summary for details." ;;
            *) echo "::error::Clear regression or gate error; see the summary and logs."; exit 1 ;;
          esac

  # After a merge, record fresh main measurements and publish them to the
  # benchmark-results branch. Only the publish step has write access.
  record:
    name: record main benchmark
    if: github.event_name == 'push'
    needs: [test, sanitizer, exhaustive]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake -S . -B build/benchmark -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOKER_BUILD_TESTS=OFF
          cmake --build build/benchmark --parallel 4
      - name: Measure
        run: |
          python3 tools/record_benchmarks.py --build build/benchmark \
            --out "$RUNNER_TEMP/main-benchmark" --samples 5 \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat "$RUNNER_TEMP/main-benchmark/latest.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/main-benchmark
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish main benchmark
    needs: record
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: main-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/main-benchmark
      - run: python3 tools/publish_benchmarks.py --report "$RUNNER_TEMP/main-benchmark/latest.json" --commit "$GITHUB_SHA"
