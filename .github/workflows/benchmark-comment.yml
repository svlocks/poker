# Posts the benchmark summary from a CI run onto its pull request.
#
# This runs in the trusted context so it can write a comment, which fork PRs
# cannot do from the CI workflow itself. It checks out nothing and executes no
# code from the PR: it only downloads the summary artifact and posts its text.
name: Benchmark comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-report
          path: ${{ runner.temp }}/report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post or update the comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report"
          # Resolve the PR from the commit rather than trusting the artifact alone.
          number=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          if [ -z "$number" ]; then echo "No open PR for $HEAD_SHA"; exit 0; fi
          claimed=$(tr -dc '0-9' < "$report/pr.txt")
          if [ "$claimed" != "$number" ]; then echo "::warning::Artifact names PR $claimed, commit belongs to PR $number; skipping"; exit 0; fi
          {
            cat "$report/summary.md"
            echo
            echo "[Run details]($RUN_URL) · commit $HEAD_SHA"
          } > "$RUNNER_TEMP/body.md"
          existing=$(gh api "repos/$REPO/issues/$number/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- poker-benchmark-report -->")))] | last | .id // empty')
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$RUNNER_TEMP/body.md" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$number/comments" -F body=@"$RUNNER_TEMP/body.md" > /dev/null
          fi
          echo "Commented on #$number"
